[package]
name = "bracco"
version = "0.2.0"
edition = "2024"
description = "Fast fuzzy file picker: git-modified files first, respects .gitignore"
license = "MIT"
repository = "https://github.com/rawnly/bracco"
homepage = "https://github.com/rawnly/bracco"
readme = "README.md"
keywords = ["fuzzy", "finder", "file-picker", "tui", "git"]
categories = ["command-line-utilities"]
exclude = [".github/", ".agents/", ".claude/", ".pi/", "assets/", "skills-lock.json", "lefthook.yml"]

[dependencies]
crossterm = "0.29.0"
eyre = "0.6.14"
fff-search = "0.11.0"
ratatui = "0.30.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[dev-dependencies]
tempfile = "3"
