[package]
name = "bracco"
version = "0.2.1"
edition = "2024"
description = "Fast fuzzy file picker: git-modified files first, respects .gitignore"
readme = "README.md"
homepage = "https://github.com/rawnly/bracco"
repository = "https://github.com/rawnly/bracco"
license = "MIT"
keywords = ["file-picker", "finder", "fuzzy", "git", "tui"]
categories = ["command-line-utilities"]
exclude = [".agents/", ".claude/", ".github/", ".pi/", "assets/", "lefthook.yml", "skills-lock.json"]

[dependencies]
crossterm = "0.29.0"
eyre = "0.6.14"
fff-search = "0.11.0"
ratatui = "0.30.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
usage = { package = "usage-rs", version = "6", features = ["completions"] }

[dev-dependencies]
tempfile = "3"
