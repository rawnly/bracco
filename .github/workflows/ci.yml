name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Toolchain first: mbx keys its cache on the rustc found on PATH.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Pushes to main save the cache; pull requests only restore it.
      - uses: jdx/mr-boxington-action@v1
      - run: mbx clippy --all-targets --locked -- -D warnings
      - run: mbx test --locked
